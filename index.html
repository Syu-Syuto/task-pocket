<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254f42"><meta name="description" content="課題を、自分のペースで。カテゴリーで整理する個人用課題管理。"><title>Task Pocket | 自分のための課題帳</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=themes-1"></head>
<body><div class="layout"><aside><a class="brand" href="./"><span class="logo">✓</span> Task Pocket</a><p class="eyebrow">YOUR PERSONAL SPACE</p><button id="all" class="nav active">すべての課題 <span id="total">0</span></button><div class="section-title">カテゴリー<button id="manage" aria-label="カテゴリーを管理">＋</button></div><nav id="categories" aria-label="カテゴリー"></nav><div class="side-bottom"><p>ひとつずつ、着実に。</p><small>今日の自分に、ちょうどいい課題帳。</small></div></aside>
<main><header><span id="today"></span><div class="header-actions"><button id="appearance">配色を選ぶ</button><button id="auth">接続を確認中…</button></div></header><div id="connection" role="status"></div><section class="heading"><div><h1 id="view-title">すべての課題</h1><p class="muted">とあえずできそうなことから処理。</p></div><button class="primary" id="add">＋ 課題を追加</button></section><section class="stats" aria-label="課題の集計"><div><span>未完了</span><strong id="pending">0</strong></div><div><span>今日が締切</span><strong id="due-today">0</strong></div><div><span>期限切れ</span><strong id="overdue">0</strong></div></section><section class="board"><div class="toolbar"><div class="tabs" role="group" aria-label="状態で絞り込み"><button class="active" data-filter="open">未完了</button><button data-filter="done">完了</button><button data-filter="all">すべて</button></div><input id="search" type="search" placeholder="課題を検索…" aria-label="課題を検索"><select id="sort" aria-label="並び順"><option value="due">締切が近い順</option><option value="new">追加した順</option></select></div><div id="tasks"></div></section><footer><span>自分のペースで、ひとつずつ。</span><button id="export">データを書き出す</button></footer><p id="message" role="alert"></p></main></div>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-head"><h2 id="form-title">課題を追加</h2><button type="button" data-close="task-dialog" aria-label="閉じる">✕</button></div><label>課題名<input name="title" required maxlength="150" placeholder="何をしますか？"></label><label>カテゴリー<select name="categoryId"></select></label><div class="fields"><label>締切日<input name="due" type="date"></label><label>状態<select name="status"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select></label></div><label>メモ<textarea name="note" rows="4" maxlength="5000" placeholder="補足や、次にすること"></textarea></label><div class="dialog-actions"><button type="button" id="delete-task" class="danger">削除</button><button type="button" data-close="task-dialog">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></dialog>
<dialog id="category-dialog"><div class="dialog-head"><h2>カテゴリーを管理</h2><button data-close="category-dialog" aria-label="閉じる">✕</button></div><p class="muted">好きな項目を追加して、自分らしく整理。</p><form id="category-form"><label>カテゴリー名<input name="name" required maxlength="40" placeholder="例：大学の授業関係"></label><label>ラベルの色<input name="color" type="color" value="#497b68"></label><button class="primary">追加する</button></form><div id="category-list"></div><p class="muted small">削除したカテゴリーの課題は「未分類」に表示されます。</p></dialog><dialog id="appearance-dialog" aria-labelledby="appearance-title"><form id="appearance-form"><div class="dialog-head"><h2 id="appearance-title">配色を選ぶ</h2><button type="button" data-close="appearance-dialog" aria-label="閉じる">✕</button></div><p class="muted">選ぶと画面で試せます。気に入ったら保存してください。</p><fieldset id="theme-options"><legend>色の組み合わせ</legend></fieldset><p id="theme-status" role="status" class="small muted"></p><p id="theme-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="appearance-dialog">キャンセル</button><button class="primary" id="save-theme" type="submit">保存する</button></div></form></dialog><script type="module" src="app.js?v=themes-1"></script></body></html>
